name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: build-only-secret-that-is-at-least-32-characters
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: build
          S3_SECRET_ACCESS_KEY: build-secret
      - run: docker compose config --quiet
      - run: docker compose -f compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
          BETTER_AUTH_URL: https://example.invalid
          BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
          S3_ACCESS_KEY_ID: ci
          S3_SECRET_ACCESS_KEY: ci-only-secret
          GEMINI_API_KEY: ci-placeholder
          SEED_ASSESSOR_EMAIL: assessor@example.invalid
          SEED_ASSESSOR_PASSWORD: ci-only-assessor-password

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: migration
          POSTGRES_PASSWORD: migration-test-password
          POSTGRES_DB: migration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U migration -d migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://migration:migration-test-password@localhost:5432/migration_test
          BETTER_AUTH_SECRET: migration-only-secret-at-least-32-characters
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: migration
          S3_SECRET_ACCESS_KEY: migration-secret
